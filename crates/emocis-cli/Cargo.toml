[package]
name = "emocis-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "emocis_cli"
path = "src/lib.rs"

[[bin]]
name = "project"
path = "src/project_bin.rs"

[[bin]]
name = "clg"
path = "src/clg_bin.rs"

[[bin]]
name = "emocis"
path = "src/main.rs"

[dependencies]
emocis-core = { workspace = true }
emocis-cclg = { workspace = true }
emocis-memory = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
